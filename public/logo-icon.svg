<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Overlay subtil pour profondeur -->
    <radialGradient id="overlay" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Shadow subtil -->
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rond avec gradient -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>

  <!-- Overlay pour effet depth -->
  <rect width="512" height="512" rx="115" fill="url(#overlay)"/>

  <!-- Lettre M en blanc, moderne -->
  <text
    x="256"
    y="360"
    font-family="'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif"
    font-size="320"
    font-weight="900"
    text-anchor="middle"
    fill="white"
    letter-spacing="-0.02em"
    filter="url(#text-shadow)"
  >M</text>
</svg>
