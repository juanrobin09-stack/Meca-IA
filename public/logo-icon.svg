<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient radial pour fond avec profondeur -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Gradient principal orange → rose → bleu -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow radial -->
    <radialGradient id="glow" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background avec profondeur -->
  <rect width="512" height="512" fill="url(#bg-radial)" rx="110"/>

  <!-- Glow effet sous l'icon -->
  <ellipse cx="256" cy="300" rx="180" ry="40" fill="url(#glow)"/>

  <!-- ICON PRINCIPALE - Voiture + IA stylisée -->
  <g transform="translate(96, 140)" filter="url(#icon-shadow)">
    <!-- Forme principale (carrosserie abstraite moderne) -->
    <path
      d="M 60 90 Q 100 30, 170 30 L 230 30 Q 270 30, 290 70 L 310 110 Q 330 150, 290 190 L 60 190 Q 20 150, 60 90 Z"
      fill="url(#icon-grad)"
    />

    <!-- Pattern IA (réseau neural stylisé) -->
    <g stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <!-- Connexions horizontales -->
      <line x1="100" y1="80" x2="125" y2="80"/>
      <line x1="165" y1="80" x2="190" y2="80"/>
      <line x1="230" y1="80" x2="255" y2="80"/>

      <!-- Noeuds principaux -->
      <circle cx="112" cy="80" r="8" fill="white"/>
      <circle cx="177" cy="80" r="8" fill="white"/>
      <circle cx="242" cy="80" r="8" fill="white"/>

      <!-- Connexions verticales -->
      <line x1="112" y1="88" x2="130" y2="115" opacity="0.6"/>
      <line x1="177" y1="88" x2="177" y2="115" opacity="0.6"/>
      <line x1="242" y1="88" x2="224" y2="115" opacity="0.6"/>

      <!-- Noeuds secondaires -->
      <circle cx="130" cy="115" r="5" fill="white" opacity="0.75"/>
      <circle cx="177" cy="115" r="5" fill="white" opacity="0.75"/>
      <circle cx="224" cy="115" r="5" fill="white" opacity="0.75"/>
    </g>

    <!-- Roues avec effet 3D -->
    <g>
      <!-- Roue gauche -->
      <circle cx="100" cy="190" r="32" fill="#0f172a"/>
      <circle cx="100" cy="190" r="25" fill="url(#icon-grad)"/>
      <circle cx="95" cy="185" r="7" fill="white" opacity="0.5"/>

      <!-- Roue droite -->
      <circle cx="255" cy="190" r="32" fill="#0f172a"/>
      <circle cx="255" cy="190" r="25" fill="url(#icon-grad)"/>
      <circle cx="250" cy="185" r="7" fill="white" opacity="0.5"/>
    </g>

    <!-- Highlights brillance (effet premium) -->
    <g stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none">
      <path d="M 215 45 Q 235 35, 255 45"/>
      <path d="M 180 40 Q 190 35, 200 40"/>
    </g>
  </g>
</svg>
