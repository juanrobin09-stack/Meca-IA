<svg width="160" height="48" viewBox="0 0 160 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient principal orange → rose → bleu -->
    <linearGradient id="mecai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Gradient pour le texte -->
    <linearGradient id="mecai-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Ombre subtile -->
    <filter id="mecai-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ICON : Voiture stylisée + réseau IA -->
  <g transform="translate(0, 4)" filter="url(#mecai-shadow)">
    <!-- Forme principale - carrosserie fluide moderne -->
    <path
      d="M 6 22 Q 10 10, 22 10 L 32 10 Q 38 10, 40 16 L 42 22 Q 44 28, 38 32 L 8 32 Q 2 28, 6 22 Z"
      fill="url(#mecai-gradient)"
    />

    <!-- Circuit IA - réseau neural stylisé -->
    <g stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
      <!-- Lignes de connexion -->
      <line x1="12" y1="18" x2="16" y2="18"/>
      <line x1="20" y1="18" x2="24" y2="18"/>
      <line x1="28" y1="18" x2="32" y2="18"/>

      <!-- Noeuds du réseau -->
      <circle cx="14" cy="18" r="2" fill="white"/>
      <circle cx="22" cy="18" r="2" fill="white"/>
      <circle cx="30" cy="18" r="2" fill="white"/>

      <!-- Connexions secondaires -->
      <line x1="14" y1="20" x2="18" y2="24" opacity="0.6"/>
      <line x1="22" y1="20" x2="22" y2="24" opacity="0.6"/>
      <line x1="30" y1="20" x2="26" y2="24" opacity="0.6"/>
    </g>

    <!-- Roues avec effet depth -->
    <circle cx="12" cy="32" r="4" fill="#1e293b"/>
    <circle cx="12" cy="32" r="3" fill="url(#mecai-gradient)"/>
    <circle cx="34" cy="32" r="4" fill="#1e293b"/>
    <circle cx="34" cy="32" r="3" fill="url(#mecai-gradient)"/>

    <!-- Highlight brillance premium -->
    <path
      d="M 28 12 Q 32 10, 36 12"
      stroke="white"
      stroke-width="1.5"
      opacity="0.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- TEXTE MECAI - Typographie bold moderne -->
  <text
    x="52"
    y="32"
    font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="26"
    font-weight="800"
    fill="url(#mecai-text-gradient)"
    letter-spacing="-0.03em"
  >MECAI</text>
</svg>
