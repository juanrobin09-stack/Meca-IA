<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Overlay subtil -->
    <radialGradient id="fav-overlay" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background avec gradient -->
  <rect width="48" height="48" rx="10" fill="url(#fav-grad)"/>

  <!-- Overlay -->
  <rect width="48" height="48" rx="10" fill="url(#fav-overlay)"/>

  <!-- Lettre M -->
  <text
    x="24"
    y="35"
    font-family="'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif"
    font-size="32"
    font-weight="900"
    text-anchor="middle"
    fill="white"
  >M</text>
</svg>
