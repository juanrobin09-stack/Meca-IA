<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradient radial pour fond avec profondeur -->
    <radialGradient id="fav-bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Gradient principal orange → rose → bleu -->
    <linearGradient id="fav-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow effect -->
    <radialGradient id="fav-glow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background avec coins arrondis premium -->
  <rect width="48" height="48" fill="url(#fav-bg-radial)" rx="10"/>

  <!-- Glow subtil sous l'icon -->
  <ellipse cx="24" cy="30" rx="16" ry="4" fill="url(#fav-glow)" opacity="0.5"/>

  <!-- ICON : Voiture + IA stylisée -->
  <g transform="translate(6, 10)">
    <!-- Forme carrosserie fluide -->
    <path
      d="M 6 14 Q 10 6, 18 6 L 26 6 Q 30 6, 32 10 L 34 14 Q 36 18, 32 22 L 6 22 Q 2 18, 6 14 Z"
      fill="url(#fav-icon-grad)"
    />

    <!-- Circuit IA -->
    <g stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
      <line x1="10" y1="12" x2="13" y2="12"/>
      <line x1="17" y1="12" x2="20" y2="12"/>
      <line x1="24" y1="12" x2="27" y2="12"/>
      <circle cx="11.5" cy="12" r="1.5" fill="white"/>
      <circle cx="18.5" cy="12" r="1.5" fill="white"/>
      <circle cx="25.5" cy="12" r="1.5" fill="white"/>
    </g>

    <!-- Roues -->
    <circle cx="10" cy="22" r="3" fill="#0f172a"/>
    <circle cx="10" cy="22" r="2.2" fill="url(#fav-icon-grad)"/>
    <circle cx="28" cy="22" r="3" fill="#0f172a"/>
    <circle cx="28" cy="22" r="2.2" fill="url(#fav-icon-grad)"/>

    <!-- Highlight -->
    <path d="M 22 8 Q 25 6.5, 28 8" stroke="white" stroke-width="1" opacity="0.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
