<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <meta name="keywords" content="diagnostic auto, mécanique, IA, réparation voiture, panne voiture, devis garage, France" />
    <meta name="author" content="Juan Robin" />
    <meta name="robots" content="index, follow" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MECAI" />

    <!-- Open Graph -->
    <meta property="og:title" content="MECAI - Diagnostic Auto par IA" />
    <meta property="og:description" content="Décris ton problème de voiture et obtiens un diagnostic expert en 2 minutes. Ton mécanicien de poche." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mecaia.fr" />
    <meta property="og:image" content="https://mecaia.fr/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="MECAI" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MECAI - Diagnostic Auto par IA" />
    <meta name="twitter:description" content="Décris ton problème de voiture et obtiens un diagnostic expert en 2 minutes." />
    <meta name="twitter:image" content="https://mecaia.fr/og-image.png" />

    <title>MECAI - Diagnostic auto par IA | Gratuit</title>

    <!-- Preconnect pour performance (charger les connexions en avance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/favicon-32.png" as="image" type="image/png" />

    <!-- Font avec display swap pour éviter FOIT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Critical CSS inline pour First Paint rapide -->
    <style>
      /* Critical CSS - Above the fold */
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f8fafc}
      #root{min-height:100vh}
      /* Loading spinner */
      .initial-loader{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc}
      .initial-loader::after{content:'';width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Initial loader shown before React hydrates -->
    <div id="root">
      <div class="initial-loader"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
