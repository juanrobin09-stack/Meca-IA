[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 5173
  functionsPort = 8888

# SPA catch-all - Netlify handles /.netlify/functions/* automatically before this
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20.19.0"

[functions]
  node_bundler = "esbuild"

  # External modules et timeout étendu pour les fonctions d'analyse
  [functions."analyze-devis-pro"]
    external_node_modules = ["@anthropic-ai/sdk"]
    timeout = 60

  [functions."analyze-quote"]
    external_node_modules = ["@anthropic-ai/sdk"]
    timeout = 60

  [functions."analyze-video-pro"]
    external_node_modules = ["@anthropic-ai/sdk"]
    timeout = 60

  [functions."*"]
    # 26 secondes par défaut (plan gratuit), les fonctions lourdes ont 60s ci-dessus
    timeout = 26

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=(self)"
